<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0f0a"/>
      <stop offset="55%" stop-color="#2d1810"/>
      <stop offset="100%" stop-color="#3d1e0c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4a261"/>
      <stop offset="100%" stop-color="#e76f51"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#e76f51" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e76f51" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Decorative code brackets -->
  <text x="100" y="130" font-family="DejaVu Sans Mono, Courier" font-size="56" fill="#f4a261" opacity="0.25">{</text>
  <text x="1060" y="540" font-family="DejaVu Sans Mono, Courier" font-size="56" fill="#f4a261" opacity="0.25">}</text>

  <!-- Avatar circle (initials) -->
  <circle cx="200" cy="315" r="120" fill="url(#accent)"/>
  <text x="200" y="345" font-family="Arial, DejaVu Sans, sans-serif" font-size="110"
        font-weight="bold" fill="#fff" text-anchor="middle">NĐ</text>

  <!-- Right side text -->
  <text x="370" y="230" font-family="Arial, DejaVu Sans, sans-serif" font-size="64"
        font-weight="bold" fill="#ffffff">Nguyễn Thế Đức</text>

  <text x="370" y="298" font-family="Arial, DejaVu Sans, sans-serif" font-size="34"
        font-weight="bold" fill="#f4a261">CEO / Co-Founder TECHLA AI</text>

  <line x1="370" y1="328" x2="510" y2="328" stroke="#f4a261" stroke-width="4"/>

  <text x="370" y="392" font-family="Arial, DejaVu Sans, sans-serif" font-size="28"
        fill="#ffffff" opacity="0.88">AI · Tự động hoá · Doanh nghiệp 1 người</text>

  <text x="370" y="442" font-family="Arial, DejaVu Sans, sans-serif" font-size="24"
        fill="#ffffff" opacity="0.65">Mọi commit lên GitHub để bạn fork &amp; remix.</text>

  <!-- Bottom URL -->
  <text x="370" y="530" font-family="DejaVu Sans Mono, Courier, monospace" font-size="26"
        font-weight="bold" fill="#f4a261">nguyentheduc.com</text>
</svg>
